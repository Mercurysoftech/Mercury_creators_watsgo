name: Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: creators-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_BASE_PATH: /
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://creators.watsgo.in/api' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://creators.watsgo.in/api' }}
        run: pnpm run build

      - name: Prepare release directory on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            mkdir -p /home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}

      - name: Upload build to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          source: "dist/*"
          target: "/home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}"
          strip_components: 1

      - name: Publish release to public_html
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -eu
            WEB_ROOT="/home/mercurysoftech/web/creators.watsgo.in/public_html"
            RELEASE_DIR="/home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}"

            mkdir -p "$WEB_ROOT"
            cp -a "$RELEASE_DIR/." "$WEB_ROOT/"

            # Clean up older releases, keeping the last 5
            cd /home/mercurysoftech/web/creators.watsgo.in/.deploy-releases
            ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf

      - name: Start or reload Node.js API with PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -eu

            # Export Node, npm, and PM2 paths into SSH environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/bin"

            WEB_ROOT="/home/mercurysoftech/web/creators.watsgo.in/public_html"
            API_DIR="$WEB_ROOT/api"
            cd "$API_DIR"

            # Check if PM2 is available
            if ! command -v pm2 > /dev/null 2>&1; then
              echo "pm2 command not found in PATH. Attempting npm install -g pm2..."
              npm install -g pm2 || true
            fi

            # Install API production dependencies
            if [ -f "package.json" ]; then
              echo "Installing API dependencies in $API_DIR..."
              npm install --omit=dev --no-audit --no-fund || true
            fi

            # If existing process was registered in cluster mode, delete it so it starts clean in fork mode
            if pm2 describe watsgo-creators-api 2>&1 | grep -qi "cluster"; then
              echo "Removing old cluster-mode process from PM2..."
              pm2 delete watsgo-creators-api || true
            fi

            # Ensure port 9876 is exported for Apache proxy compatibility
            export PORT=9876
            export API_PORT=9876
            export NODE_ENV=production

            # Start or restart in fork mode
            if pm2 describe watsgo-creators-api > /dev/null 2>&1; then
              echo "Restarting existing PM2 process in fork mode..."
              PORT=9876 API_PORT=9876 pm2 restart watsgo-creators-api --update-env
            else
              echo "Starting PM2 process in fork mode on port 9876..."
              PORT=9876 API_PORT=9876 pm2 start server.js --name "watsgo-creators-api"
            fi

            # Save PM2 process list for auto-recovery on system reboot
            pm2 save || true
            pm2 status

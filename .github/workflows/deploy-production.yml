name: Deploy Production

on:
  push:
    branches:
      - production
      - main
      - jana_deploy_231126
  workflow_dispatch:

concurrency:
  group: creators-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_BASE_PATH: /
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://creators.watsgo.in/' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://creators.watsgo.in/' }}
        run: pnpm run build

      - name: Prepare release directory on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            mkdir -p /home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}

      - name: Upload build to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          source: "dist/*"
          target: "/home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}"
          strip_components: 1

      - name: Publish release to public_html
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -eu
            WEB_ROOT="/home/mercurysoftech/web/creators.watsgo.in/public_html"
            RELEASE_DIR="/home/mercurysoftech/web/creators.watsgo.in/.deploy-releases/${{ github.sha }}"

            mkdir -p "$WEB_ROOT"
            cp -a "$RELEASE_DIR/." "$WEB_ROOT/"

            # Clean up older releases, keeping the last 5
            cd /home/mercurysoftech/web/creators.watsgo.in/.deploy-releases
            ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf
